<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Historia — Mepiache Helados Artesanales</title>
  <meta name="description" content="La historia de Mepiache: una tradición familiar que comenzó en 1954 en San Joaquín, Santiago.">

  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script src="drawer.js"></script>
  <script src="contacto.js"></script>
  <script>
if (!e.target.closest('.header')) { headerEl.classList.remove('menu-abierto'); menuToggle.setAttribute('aria-expanded', 'false'); }
    });

    /* ── TIMELINE CUENTO ── */
    (function () {
      var pasos = [
        {
          year: '1954',
          titulo: 'El comienzo',
          texto: 'Comienza una tradición familiar dedicada a la elaboración artesanal de helados, con el propósito de construir un legado familiar y convertirse en parte de la vida del barrio.',
          img: 'img/local-historico.jpg'
        },
        {
          year: '1966',
          titulo: 'Nacen las paletas',
          texto: 'La fabricación de paletas se incorpora a la historia de la marca, ampliando sus productos sin perder el sello artesanal.',
          img: 'img/paletas-variedad.jpg'
        },
        {
          year: 'Años 80',
          titulo: 'Mepiache toma forma',
          texto: 'Nace y se consolida la marca Mepiache, inspirada en la expresión italiana «me piace», que significa «me gusta», pero llevada a una forma más cercana y propia.',
          img: 'img/chef-local.jpg'
        },
        {
          year: '2006',
          titulo: 'Sustancias y confites',
          texto: 'Mepiache amplía su tradición hacia los confites artesanales, helados de invierno y sustancias, manteniendo el mismo estándar de sabor y calidad.',
          img: 'img/local-historico.jpg'
        },
        {
          year: '2015',
          titulo: 'Historia reconocida',
          texto: 'La trayectoria de Mepiache es reconocida como parte de la memoria cultural y patrimonial del barrio.',
          img: 'img/familia-mepiache.jpg'
        },
        {
          year: 'Hoy',
          titulo: 'Tradición con mirada de futuro',
          texto: 'Mepiache continúa elaborando helados, paletas, sustancias y productos tradicionales, manteniendo vivo el sabor de siempre y adaptándose a nuevos tiempos.',
          img: 'img/palos-paleta.jpg'
        }
      ];

      var items     = document.querySelectorAll('.th-item');
      var progreso  = document.getElementById('thProgreso');
      var panelImg  = document.getElementById('thPanelImg');
      var panelYear = document.getElementById('thPanelYear');
      var panelTit  = document.getElementById('thPanelTitulo');
      var panelTxt  = document.getElementById('thPanelTexto');
      var panel     = document.getElementById('thPanel');
      var dotsWrap  = document.getElementById('thDotsNav');
      var btnPrev   = document.getElementById('thPrev');
      var btnNext   = document.getElementById('thNext');
      var wrap      = document.getElementById('thWrap');
      var actual    = 0;

      function buildDots() {
        dotsWrap.innerHTML = '';
        pasos.forEach(function (_, i) {
          var d = document.createElement('button');
          d.className = 'th-dot-nav';
          d.setAttribute('aria-label', 'Paso ' + (i + 1));
          d.addEventListener('click', function () { irA(i); });
          dotsWrap.appendChild(d);
        });
      }

      function actualizarEstados(idx) {
        items.forEach(function (el, i) {
          el.classList.remove('th-futuro', 'th-pasado', 'th-activo');
          if (i < idx)       el.classList.add('th-pasado');
          else if (i === idx) el.classList.add('th-activo');
          else               el.classList.add('th-futuro');
        });

        var dots = dotsWrap.querySelectorAll('.th-dot-nav');
        dots.forEach(function (d, i) {
          d.classList.toggle('activo', i === idx);
        });

        /* progress line: go from left edge of first node to center of active node */
        var wrapRect = wrap.getBoundingClientRect();
        var activeEl = items[idx];
        var nodo = activeEl.querySelector('.th-nodo');
        if (nodo) {
          var nodoRect = nodo.getBoundingClientRect();
          var nodoCentro = nodoRect.left + nodoRect.width / 2 - wrapRect.left;
          progreso.style.width = Math.max(0, nodoCentro) + 'px';
        }

        btnPrev.disabled = idx === 0;
        btnNext.disabled = idx === pasos.length - 1;

        /* scroll active node into view horizontally — solo sobre el contenedor, sin tocar scroll vertical de página */
        var scrollCont = document.querySelector('.th-scroll');
        if (scrollCont && nodo) {
          var center = nodo.offsetLeft + nodo.offsetWidth / 2 - scrollCont.offsetWidth / 2;
          scrollCont.scrollTo({ left: Math.max(0, center), behavior: 'smooth' });
        }
      }

      function actualizarPanel(idx) {
        panel.style.opacity = '0';
        panel.style.transform = 'translateY(10px)';
        setTimeout(function () {
          var p = pasos[idx];
          panelYear.textContent = p.year;
          panelTit.textContent  = p.titulo;
          panelTxt.textContent  = p.texto;
          if (p.img) {
            panelImg.src = p.img;
            panelImg.style.display = '';
          } else {
            panelImg.style.display = 'none';
          }
          panel.style.opacity   = '1';
          panel.style.transform = 'translateY(0)';
        }, 180);
      }

      function irA(idx) {
        actual = Math.max(0, Math.min(pasos.length - 1, idx));
        actualizarEstados(actual);
        actualizarPanel(actual);
      }

      /* events */
      btnPrev.addEventListener('click', function () { irA(actual - 1); });
      btnNext.addEventListener('click', function () { irA(actual + 1); });

      items.forEach(function (el) {
        el.addEventListener('click', function () {
          irA(parseInt(el.dataset.step, 10));
        });
        el.style.cursor = 'pointer';
      });

      /* panel transition */
      panel.style.transition = 'opacity 0.25s ease, transform 0.25s ease';

      buildDots();
      irA(0);

      /* recalculate progress on resize */
      window.addEventListener('resize', function () { actualizarEstados(actual); });

      /* swipe left/right on the panel to navigate steps */
      var swipeStartX = 0, swipeStartY = 0;
      panel.addEventListener('touchstart', function (e) {
        swipeStartX = e.changedTouches[0].clientX;
        swipeStartY = e.changedTouches[0].clientY;
      }, { passive: true });
      panel.addEventListener('touchend', function (e) {
        var dx = e.changedTouches[0].clientX - swipeStartX;
        var dy = e.changedTouches[0].clientY - swipeStartY;
        /* solo activar si el gesto es claramente horizontal (no un scroll vertical diagonal) */
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          irA(actual + (dx < 0 ? 1 : -1));
        }
      }, { passive: true });
    })();
  </script>
</body>
</html>
