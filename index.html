<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mepiache — Helados Artesanales Desde 1954</title>
  <meta name="description" content="Mepiache, heladería artesanal familiar con historia desde 1954. Paletas, helados y sustancias elaborados con oficio y tradición.">

  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script src="drawer.js"></script>
  <script src="contacto.js"></script>
  <script>
if (!e.target.closest('.header')) { headerEl.classList.remove('menu-abierto'); menuToggle.setAttribute('aria-expanded', 'false'); }
    });

    // Reviews carousel
    (function () {
      const track   = document.getElementById('reviewsTrack');
      const dotsEl  = document.getElementById('reviewsDots');
      if (!track || !dotsEl) return;

      const cards   = Array.from(track.querySelectorAll('.review-card'));
      const prevBtn = document.querySelector('.carousel-prev');
      const nextBtn = document.querySelector('.carousel-next');
      let current   = 0;

      function visibleCount() {
        return window.innerWidth < 640 ? 1 : window.innerWidth < 960 ? 2 : 3;
      }

      function maxIndex() {
        return Math.max(0, cards.length - visibleCount());
      }

      function cardStep() {
        return cards[0] ? cards[0].offsetWidth + 16 : 0;
      }

      function buildDots() {
        dotsEl.innerHTML = '';
        const total = maxIndex() + 1;
        for (let i = 0; i < total; i++) {
          const btn = document.createElement('button');
          btn.className = 'carousel-dot' + (i === current ? ' activo' : '');
          btn.setAttribute('aria-label', 'Ir a reseña ' + (i + 1));
          btn.addEventListener('click', () => goTo(i));
          dotsEl.appendChild(btn);
        }
      }

      function goTo(index) {
        current = Math.max(0, Math.min(index, maxIndex()));
        track.style.transform = 'translateX(-' + (current * cardStep()) + 'px)';

        dotsEl.querySelectorAll('.carousel-dot').forEach(function (d, i) {
          d.classList.toggle('activo', i === current);
        });

        if (prevBtn) {
          prevBtn.disabled      = current === 0;
          prevBtn.style.opacity = current === 0 ? '0.35' : '1';
        }
        if (nextBtn) {
          nextBtn.disabled      = current >= maxIndex();
          nextBtn.style.opacity = current >= maxIndex() ? '0.35' : '1';
        }
      }

      if (prevBtn) prevBtn.addEventListener('click', function () { goTo(current - 1); });
      if (nextBtn) nextBtn.addEventListener('click', function () { goTo(current + 1); });

      buildDots();
      goTo(0);

      window.addEventListener('resize', function () {
        current = Math.min(current, maxIndex());
        buildDots();
        goTo(current);
      });
    })();
  </script>
</body>
</html>
